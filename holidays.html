---
layout: default
title: "Holidays"
category: Holidays
permalink: /holidays/
---

<h2>Holidays</h2>

<ul>
  {% for post in site.categories.Holidays %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <small>({{ post.date | date: "%d/%m/%Y" }})</small>
    </li>
  {% else %}
    <p>Ancora nessun articolo in questa categoria.</p>
  {% endfor %}
</ul>
