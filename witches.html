---
layout: default
title: "Witches"
category: "witches"
permalink: /witches/
---

<section class="category-header">
  <h2>Witches</h2>
</section>

<div class="posts-grid">
  {% for post in site.categories.witches %}
    <article class="post-card">
      <div class="post-card-content">
        <span class="post-card-category">Witches</span>
        <h3 class="post-card-title">
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </h3>
        <span class="post-card-date">{{ post.date | date: "%d/%m/%Y" }}</span>
      </div>
    </article>
  {% else %}
    <p>Ancora nessun articolo in questa categoria.</p>
  {% endfor %}
</div>
