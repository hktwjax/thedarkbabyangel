---
layout: default
title: Art History
category: art-history
permalink: /art-history/
---

<body class="theme-art-history">

<section class="category-header">
  <h2>Art History</h2>
</section>

<div class="posts-grid">
  {% for post in site.categories.art-history %}
    <article class="post-card">
      <div class="post-card-content">
        <span class="post-card-category">Art History</span>
        <h3 class="post-card-title">
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </h3>
        <span class="post-card-date">{{ post.date | date: "%d/%m/%Y" }}</span>
      </div>
    </article>
  {% else %}
    <p>Nessun post presente in questa categoria al momento.</p>
  {% endfor %}
</div>

<!-- Decorazione in basso a destra per Art History -->
<div class="decor-art-history decor-finestra"></div>
</body>
