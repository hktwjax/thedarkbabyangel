layout: default

<h2>Recipes</h2>

<ul>
  {% for post in site.categories.Recipes %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <small>({{ post.date | date: "%d/%m/%Y" }})</small>
    </li>
  {% else %}
    <p>Ancora nessun articolo in questa categoria.</p>
  {% endfor %}
</ul>
