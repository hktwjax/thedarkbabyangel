---
layout: default
title: "Recipes"
category: Recipes
permalink: /recipes/
---

<h2>Recipes</h2>

<div class="recipes-list">
  {% for post in site.categories.Recipes %}
    <div class="post-box" style="border: 1px solid rgba(255,255,255,0.12); background: rgba(25, 20, 20, 0.5); padding: 18px 22px; margin-bottom: 20px; border-radius: 8px;">
      <small style="text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1.5px; opacity: 0.6; display: block; margin-bottom: 6px;">Recipes</small>
      <h3 style="margin: 0 0 10px 0; font-size: 1.3rem; font-weight: normal;">
        <a href="{{ post.url | relative_url }}" style="text-decoration: none; color: inherit;">{{ post.title }}</a>
      </h3>
      <small style="opacity: 0.5; font-size: 0.85rem;">{{ post.date | date: "%d/%m/%Y" }}</small>
    </div>
  {% else %}
    <p>Ancora nessun articolo in questa categoria.</p>
  {% endfor %}
</div>
