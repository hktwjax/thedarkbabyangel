---
layout: default
---

<article class="post-container">
  <header class="post-header">
    <span class="post-card-category">{{ page.category }}</span>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%d/%m/%Y" }}</p>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
